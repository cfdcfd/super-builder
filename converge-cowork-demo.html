// 项目统计
function projStats(p) {
  const need = p.loops.filter((l) => ATTENTION.has(l.state)).length;
  const running = p.loops.filter((l) => l.state === "running" || l.state === "converging").length;
  const done = p.loops.filter((l) => l.state === "done").length;
  return { total: p.loops.length, need, running, done };
}
// loop 排序：注意项在前，再收敛中，再运行，再已完成
const ORDER = { needYou: 0, escalated: 1, converging: 2, running: 3, done: 4 };
function sortedLoops(p) {
  return [...p.loops].sort((a, b) => ORDER[a.state] - ORDER[b.state]);
}
const PRI = {
  high: { label: "需判断", c: C.clay }, med: { label: "需拍板", c: "#B8923E" },

        </p>
      </header>

      {/* 项目概览卡 */}
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16,
        padding: "22px 24px", marginBottom: 30 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontFamily: SERIF, fontSize: 21, fontWeight: 500, color: C.ink }}>{proj.name}</h2>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.dim }}>{proj.id}</span>
        </div>
        <p style={{ margin: "0 0 18px", color: C.body, fontSize: 14, lineHeight: 1.6 }}>{proj.blurb}</p>
        <StatusStrip loops={loops} />
        <div style={{ display: "flex", gap: 22, marginTop: 16, fontFamily: MONO, fontSize: 12, flexWrap: "wrap" }}>
          <Stat n={st.total} t="loop" />
          <Stat n={st.need} t="待你" tone={st.need ? "clay" : "ok"} />
          <Stat n={st.running} t="在跑" tone="ok" />
          <Stat n={st.done} t="已收敛" />
        </div>
      </div>

      {/* 1. 需要你的 loop（浮顶）*/}
      {attn.length > 0 && (
        <Section title="需要你" hint="结果存疑 / 价值判断 / 循环失效">
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {attn.map((l) => <LoopCard key={l.id} l={l} onOpen={onOpen} prominent />)}
          </div>
        </Section>
      )}

      {/* 2. 自动收敛中（系统在替你处理，不必看）*/}
      {conv.length > 0 && (
        <Section title="自动收敛中" hint="系统在替你迭代，收住了就归档，不必打扰你">
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {conv.map((l) => <LoopRow key={l.id} l={l} />)}
          </div>
        </Section>
      )}

      {/* 3. 运行中（安静网格）*/}
      {run.length > 0 && (
        <Section title="运行中" hint={`${run.length} 个长程任务在跑，尚未产出结果`}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 8 }}>
            {run.map((l) => <LoopChip key={l.id} l={l} />)}
          </div>
        </Section>
      )}

      {/* 4. 已收敛（折叠）*/}
      {done.length > 0 && <DoneFold loops={done} />}
    </div>
  );
}

function Section({ title, hint, children }) {
  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}>
        <h3 style={{ margin: 0, fontSize: 15, fontWeight: 600, color: C.ink }}>{title}</h3>
        <span style={{ color: C.faint, fontFamily: MONO, fontSize: 11 }}>{hint}</span>
      </div>
      {children}
    </div>
  );
}

// 概览条：每个 loop 一格，颜色=状态
function StatusStrip({ loops }) {
  return (
    <div style={{ display: "flex", gap: 4 }}>
      {loops.map((l) => {
        const s = LOOP_STATE[l.state];
        const lit = ATTENTION.has(l.state);
        return (
          <div key={l.id} title={`${l.id} · ${s.label}`} style={{ flex: 1, height: 9, borderRadius: 3,
            background: lit ? s.dot : l.state === "converging" ? C.projSoft : l.state === "done" ? C.line2 : C.okSoft,
            border: `1px solid ${lit ? "transparent" : C.line}` }} />
        );
      })}
    </div>
  );
}

function Stat({ n, t, tone }) {
  const c = tone === "ok" ? C.ok : tone === "clay" ? C.clay : C.ink;
  return (
    <span style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
      <span style={{ fontSize: 17, fontWeight: 700, color: c }}>{n}</span>
      <span style={{ color: C.dim }}>{t}</span>
    </span>
  );
}

// 已收敛折叠区
function DoneFold({ loops }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ marginBottom: 30 }}>
      <button onClick={() => setOpen(!open)} style={{ all: "unset", cursor: "pointer", display: "flex",
        alignItems: "center", gap: 9, marginBottom: open ? 14 : 0, color: C.dim, fontSize: 14 }}>
        <span style={{ fontSize: 12, color: C.faint }}>{open ? "▾" : "▸"}</span>
        <span style={{ fontWeight: 600 }}>已收敛 {loops.length} 个</span>
        <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>· 通过独立审查，已归档</span>
      </button>
      {open && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 8 }}>
          {loops.map((l) => <LoopChip key={l.id} l={l} muted />)}
        </div>
      )}
    </div>
  );
}

// 需要你的 loop —— 大卡片
function LoopCard({ l, onOpen, prominent }) {
  const p = l.pri ? PRI[l.pri] : { label: LOOP_STATE[l.state].label, c: LOOP_STATE[l.state].c };
  const [h, setH] = useState(false);
  return (
    <button onClick={() => onOpen(l)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ all: "unset", cursor: "pointer", display: "block", background: h ? C.raised : C.surface,
        border: `1px solid ${h ? C.clay + "66" : C.line}`, borderLeft: `3px solid ${p.c}`,
        borderRadius: 14, padding: "17px 20px", transition: "all .14s",
        boxShadow: h ? "0 2px 12px rgba(204,120,92,.08)" : "none" }}>
      <div style={{ display: "flex", justifyContent: "space-between", gap: 16 }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 9 }}>
            <span style={{ fontFamily: MONO, fontSize: 10, color: p.c, border: `1px solid ${p.c}66`,
              borderRadius: 20, padding: "2px 9px", background: p.c === C.clay ? C.claySoft : "transparent" }}>{p.label}</span>
            <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>{l.id}</span>
            {l.rounds > 0 && <span style={{ fontFamily: MONO, fontSize: 10,
              color: l.state === "escalated" ? C.danger : C.dim }}>已 {l.rounds} 轮</span>}
          </div>
          <div style={{ fontFamily: SERIF, fontSize: 16, fontWeight: 500, color: C.ink, marginBottom: 6 }}>{l.title}</div>
          <div style={{ color: C.dim, fontSize: 13, lineHeight: 1.5 }}>
            <span style={{ color: p.c, fontFamily: MONO, fontSize: 12 }}>{l.routeReason}</span>
            <span style={{ color: C.faint }}>　·　{l.deliverable}</span>
          </div>
        </div>
        <div style={{ textAlign: "right", fontFamily: MONO, fontSize: 11, color: C.faint, whiteSpace: "nowrap", paddingTop: 2 }}>
          <div style={{ maxWidth: 120, whiteSpace: "normal", lineHeight: 1.45 }}>{l.confidence}</div>
          <div style={{ marginTop: 12, color: h ? p.c : C.faint }}>
            {l.state === "escalated" ? "进攻关 →" : "看结果 →"}
          </div>
        </div>
      </div>
    </button>
  );
}

// 自动收敛中 —— 行
function LoopRow({ l }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, background: C.surface,
      border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 16px" }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: C.proj, flexShrink: 0 }}
        className="breathe" />
      <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint, width: 70, flexShrink: 0 }}>{l.id}</span>
      <span style={{ flex: 1, fontSize: 13.5, color: C.ink, fontWeight: 500 }}>{l.title}</span>
      <span style={{ fontSize: 12, color: C.proj, fontFamily: MONO }}>{l.sub}</span>
      <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint, width: 48, textAlign: "right" }}>{l.step}</span>
    </div>
  );
}

// 运行中 / 已收敛 —— 小芯片
function LoopChip({ l, muted }) {
  const s = LOOP_STATE[l.state];
  return (
    <div style={{ background: muted ? "transparent" : C.surface, border: `1px solid ${C.line}`,
      borderRadius: 11, padding: "11px 13px", opacity: muted ? .65 : 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{ width: 6, height: 6, borderRadius: "50%", background: s.dot, flexShrink: 0 }}
          className={l.state === "running" ? "breathe" : ""} />
        <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint }}>{l.id}</span>
        <span style={{ marginLeft: "auto", fontFamily: MONO, fontSize: 10.5, color: s.c }}>
          {l.state === "done" ? "✓" : l.step}
        </span>
      </div>
      <div style={{ fontSize: 13, color: muted ? C.dim : C.ink, fontWeight: 500, lineHeight: 1.35 }}>{l.title}</div>
    </div>
  );
}

// ── 屏 2：结果批注 + 收敛循环 ─────────────────────────────────
function ResultScreen({ r, proj, onBack, onEscalate }) {
  const [phase, setPhase] = useState("annotate"); // annotate | naive | converge
  const [notes, setNotes] = useState({});          // { blockId: text }
  const [active, setActive] = useState(null);      // 正在批注的 blockId

  const suspectId = DOC.blocks.find((b) => b.suspect)?.id;
  const suspectAnnotated = !!notes[suspectId];

  function addNote(id, text) {
    setNotes((n) => ({ ...n, [id]: text }));
    setActive(null);
  }
  function removeNote(id) {
    setNotes((n) => { const m = { ...n }; delete m[id]; return m; });
  }

  return (
    <div className="fade" style={{ paddingTop: 28 }}>
      <Crumb proj={proj} r={r} onBack={onBack} />

      {/* 审查者裁决条 */}
      <div style={{ background: C.surface, border: `1px solid ${C.danger}44`, borderRadius: 14,
        padding: "14px 18px", marginBottom: 18 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
          <span style={{ fontFamily: MONO, fontSize: 11, color: C.danger, border: `1px solid ${C.danger}66`,
            borderRadius: 20, padding: "2px 10px", background: C.dangerSoft }}>独立审查：{REVIEW.verdict}</span>
          <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>点击任意文档元素 · 在右侧批注</span>
        </div>
        <p style={{ margin: 0, color: C.body, fontSize: 13, lineHeight: 1.6 }}>{REVIEW.summary}</p>
      </div>

      {phase === "annotate" && (
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 320px", gap: 18, alignItems: "start" }}>
          {/* 左：可批注的 HTML 产物（点击选中元素，不就地展开）*/}
          <AnnotatableDoc notes={notes} active={active}
            onPick={setActive} suspectId={suspectId} />

          {/* 右：批注侧栏（输入与列表都在这里）*/}
          <NotePanel notes={notes} active={active} onRemove={removeNote}
            onAdd={addNote} onCancel={() => setActive(null)} suspectId={suspectId}
            suspectAnnotated={suspectAnnotated}
            onSubmit={() => setPhase("naive")} />
        </div>
      )}

      {/* 提交后：收敛对比 */}
      {phase !== "annotate" && (
        <>
          <Eyebrow t={`你批注了「${shortBlock(DOC.blocks.find(b=>b.id===suspectId))}」· 看同一条批注的两种命运`} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, alignItems: "start" }}>
            <Lane title="多数产品：直接把批注丢回 agent" tone="bad">
              {NAIVE_STEPS.map((s, i) => <Turn key={i} s={s} />)}
              <Stamp tone="bad" text="循环假收敛 · 你被一句「已修复」骗过" />
            </Lane>
            <Lane title="Converge：锚定元素 + 强制归因 + 收敛判据" tone="ok"
              locked={phase === "naive"} onUnlock={() => setPhase("converge")}>
              {phase !== "naive" && CONVERGE_STEPS.map((s, i) => <Turn key={i} s={s} />)}
              {phase !== "naive" && <Stamp tone="ok" text="审查者复核通过 · 真收敛，无需你看过程" />}
            </Lane>
          </div>

          {phase === "converge" && (
            <div style={{ marginTop: 20, display: "flex", gap: 14, alignItems: "center",
              background: C.okSoft, border: `1px solid ${C.ok}44`, borderRadius: 14, padding: "16px 20px" }}>
              <span style={{ color: C.ok, fontSize: 18 }}>✓</span>
              <div style={{ flex: 1, color: C.body, fontSize: 13.5, lineHeight: 1.6 }}>
                <b style={{ color: C.ink }}>这一个结果收敛了。</b> 你的批注锚定在那段代码上，模型据此归因重跑，
                没让你打开那一小时过程。正因为多数循环自己就收住了，你才能同时管几十个 loop。
              </div>
              <button onClick={onBack} style={btnGhost}>回项目台</button>
            </div>
          )}

          <div style={{ marginTop: 18, display: "flex", gap: 10, alignItems: "center",
            color: C.dim, fontSize: 12.5, fontFamily: MONO }}>
            <span>若反复改不动 →</span>
            <button onClick={onEscalate} style={{ all: "unset", cursor: "pointer", color: C.danger,
              borderBottom: `1px dashed ${C.danger}` }}>看已升级的攻关案例 →</button>
          </div>
        </>
      )}
    </div>
  );
}

function shortBlock(b) {
  if (!b) return "代码块";
  if (b.kind === "code") return "rotateRefresh 代码块";
  if (b.kind === "table") return b.text;
  return (b.text || "").slice(0, 14) + "…";
}

// ── 可批注的 HTML 文档（点击选中，批注在右侧）──────────────────
function AnnotatableDoc({ notes, active, onPick, suspectId }) {
  return (
    <div style={{ background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 14,
      overflow: "hidden" }}>
      {/* 文档头 */}
      <div style={{ padding: "16px 22px", borderBottom: `1px solid ${C.line2}`, background: C.surface }}>
        <div style={{ fontFamily: SERIF, fontSize: 19, fontWeight: 500, color: C.ink, marginBottom: 4 }}>{DOC.title}</div>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>{DOC.meta}</div>
      </div>
      {/* 文档体 */}
      <div style={{ padding: "10px 14px 22px" }}>
        {DOC.blocks.map((b) => (
          <AnnBlock key={b.id} b={b} note={notes[b.id]} isActive={active === b.id}
            isSuspect={b.id === suspectId} onPick={() => onPick(b.id)} />
        ))}
      </div>
    </div>
  );
}

function AnnBlock({ b, note, isActive, isSuspect, onPick }) {
  const [hover, setHover] = useState(false);
  const annotated = !!note;
  const wrapBase = {
    position: "relative", borderRadius: 8, transition: "background .12s, box-shadow .12s",
    cursor: "pointer", margin: "2px 0", padding: "6px 10px",
    background: isActive ? C.claySoft : annotated ? C.clayWash : hover ? C.line2 + "88" : "transparent",
    boxShadow: isActive ? `0 0 0 2px ${C.clay}` : annotated ? `inset 3px 0 0 ${C.clay}` : "none",
  };
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
      <div style={wrapBase} onClick={onPick}>
        {/* 角标：已批注 / 可批注 / 审查者标记 */}
        {annotated ? (
          <Corner color={C.clay} bg={C.surface2} bordered text="✎ 已批注" />
        ) : isActive ? (
          <Corner color="#FFF" bg={C.clay} text="批注中 →" />
        ) : isSuspect ? (
          <Corner color={C.danger} bg={C.dangerSoft} text="⚠ 审查者标记" />
        ) : hover ? (
          <Corner color={C.faint} bg={C.surface2} bordered text="＋ 批注" />
        ) : null}
        <BlockBody b={b} />
      </div>
    </div>
  );
}

function Corner({ color, bg, bordered, text }) {
  return (
    <span style={{ position: "absolute", top: 4, right: 6, fontFamily: MONO, fontSize: 10,
      color, background: bg, borderRadius: 6, padding: "1px 7px",
      border: bordered ? `1px solid ${C.line}` : "none", zIndex: 1 }}>{text}</span>
  );
}

function BlockBody({ b }) {
  if (b.kind === "h2")
    return <div style={{ fontFamily: SERIF, fontSize: 16, fontWeight: 600, color: C.ink, margin: "6px 0 2px" }}>{b.text}</div>;
  if (b.kind === "p")
    return <p style={{ margin: 0, fontSize: 14, lineHeight: 1.7, color: C.body }}>{b.text}</p>;
  if (b.kind === "code")
    return (
      <pre style={{ margin: 0, fontFamily: MONO, fontSize: 12.5, lineHeight: 1.65, color: C.ink,
        background: C.bg, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px",
        overflowX: "auto", whiteSpace: "pre" }}>{b.text}</pre>
    );
  if (b.kind === "callout")
    return (
      <div style={{ fontSize: 13, lineHeight: 1.6, color: C.clayDeep, background: C.clayWash,
        borderRadius: 8, padding: "10px 13px" }}>{b.text}</div>
    );
  if (b.kind === "table")
    return (
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <tbody>
          {b.rows.map((row, ri) => (
            <tr key={ri} style={{ background: ri === 0 ? C.surface : ri === b.suspectRow ? C.dangerSoft + "66" : "transparent" }}>
              {row.map((cell, ci) => (
                <td key={ci} style={{ border: `1px solid ${C.line}`, padding: "7px 11px",
                  fontWeight: ri === 0 ? 600 : 400, color: ri === 0 ? C.ink : C.body,
                  fontFamily: ri === 0 ? SANS : SANS }}>{cell}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    );
  return null;
}

// ── 批注侧栏（输入 + 列表都在右侧）────────────────────────────
function NotePanel({ notes, active, onAdd, onRemove, onCancel, suspectId, suspectAnnotated, onSubmit }) {
  const ids = Object.keys(notes);
  const activeBlock = active ? DOC.blocks.find((b) => b.id === active) : null;

  return (
    <div style={{ position: "sticky", top: 16, background: C.surface, border: `1px solid ${C.line}`,
      borderRadius: 14, overflow: "hidden" }}>
      <div style={{ padding: "13px 16px", borderBottom: `1px solid ${C.line2}`, display: "flex",
        alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 13.5, fontWeight: 600, color: C.ink }}>批注</span>
        <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint }}>{ids.length} 条</span>
      </div>

      {/* 顶部：针对当前选中元素的输入框 */}
      {activeBlock ? (
        <NoteEditor key={active} block={activeBlock} initial={notes[active]}
          suspect={active === suspectId}
          onSave={(t) => onAdd(active, t)} onCancel={onCancel} />
      ) : (
        <div style={{ padding: "14px 16px", borderBottom: `1px solid ${C.line2}`,
          color: C.faint, fontSize: 12.5, lineHeight: 1.6, background: C.surface2 }}>
          点击左侧文档的任意元素，在这里写下批注。每条都会锚定到你选中的元素。
        </div>
      )}

      {/* 批注列表 */}
      <div style={{ padding: 12, display: "flex", flexDirection: "column", gap: 9, maxHeight: 320, overflowY: "auto" }}>
        {ids.length === 0 ? (
          <div style={{ color: C.faint, fontSize: 12, lineHeight: 1.6, padding: "4px 4px" }}>
            还没有批注。
          </div>
        ) : ids.map((id) => {
          const b = DOC.blocks.find((x) => x.id === id);
          const isEditing = id === active;
          return (
            <div key={id}
              style={{ background: isEditing ? C.claySoft : C.surface2,
                border: `1px solid ${isEditing ? C.clay + "66" : C.line}`,
                borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                <span style={{ fontFamily: MONO, fontSize: 10, color: C.clay, background: C.claySoft,
                  borderRadius: 5, padding: "1px 7px" }}>↳ {shortBlock(b)}</span>
                <button onClick={() => onRemove(id)} style={{ all: "unset", cursor: "pointer",
                  color: C.faint, fontSize: 13 }}>✕</button>
              </div>
              <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.5 }}>{notes[id]}</div>
            </div>
          );
        })}
      </div>

      <div style={{ padding: 12, borderTop: `1px solid ${C.line2}` }}>
        {!suspectAnnotated && (
          <div style={{ fontFamily: MONO, fontSize: 10.5, color: C.faint, marginBottom: 9, lineHeight: 1.5 }}>
            提示：审查者标记的那段代码（⚠）最值得你批注。
          </div>
        )}
        <button onClick={onSubmit} disabled={ids.length === 0}
          style={{ ...btnPrimary, opacity: ids.length ? 1 : .4,
            cursor: ids.length ? "pointer" : "not-allowed" }}>
          提交批注 · 看会发生什么
        </button>
      </div>
    </div>
  );
}

// 右侧输入框（针对选中元素）
function NoteEditor({ block, initial, suspect, onSave, onCancel }) {
  const [v, setV] = useState(initial || "");
  return (
    <div className="fade" style={{ padding: 14, borderBottom: `1px solid ${C.line2}`,
      background: C.clayWash }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 8 }}>
        <span style={{ fontFamily: MONO, fontSize: 10, color: "#FFF", background: C.clay,
          borderRadius: 5, padding: "2px 8px" }}>↳ {shortBlock(block)}</span>
        <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.dim }}>批注锚定到此元素</span>
      </div>
      <textarea autoFocus value={v} onChange={(e) => setV(e.target.value)} rows={3}
        placeholder={suspect ? "例：先删后发不是原子操作，并发下会丢牌。换 CAS 原子换牌。" : "写下你对这个元素的意见…"}
        style={{ width: "100%", boxSizing: "border-box", resize: "none", background: C.surface2,
          border: `1px solid ${C.line}`, borderRadius: 8, color: C.ink, padding: "9px 11px",
          fontFamily: SANS, fontSize: 13.5, lineHeight: 1.5, outline: "none" }} />
      <div style={{ display: "flex", gap: 8, marginTop: 9 }}>
        <button onClick={() => v.trim() && onSave(v.trim())} disabled={!v.trim()}
          style={{ ...btnPrimary, width: "auto", padding: "7px 15px", fontSize: 12.5,
            opacity: v.trim() ? 1 : .45, cursor: v.trim() ? "pointer" : "not-allowed" }}>
          {initial ? "更新批注" : "保存批注"}
        </button>
        <button onClick={onCancel} style={{ ...btnGhost, padding: "7px 14px", fontSize: 12.5 }}>取消</button>
      </div>
    </div>
  );
}

function Lane({ title, tone, children, locked, onUnlock }) {
  const col = tone === "bad" ? C.danger : C.ok;
  return (
    <div style={{ background: C.surface, border: `1px solid ${col}33`, borderRadius: 14, overflow: "hidden" }}>
      <div style={{ padding: "12px 16px", borderBottom: `1px solid ${C.line2}`, fontSize: 12.5,
        fontWeight: 600, color: col }}>{title}</div>
      <div style={{ padding: 14, display: "flex", flexDirection: "column", gap: 10, minHeight: 88 }}>
        {locked ? (
          <button onClick={onUnlock} style={{ all: "unset", cursor: "pointer", textAlign: "center",
            color: C.ok, fontSize: 13, padding: "22px 0", border: `1px dashed ${C.ok}55`, borderRadius: 10 }}>
            ▶ 看 Converge 怎么处理同一条批注
          </button>
        ) : children}
      </div>
    </div>
  );
}
function Turn({ s }) {
  const map = {
    you: { c: C.clay, lbl: "你" },
    bot: { c: s.bad ? C.danger : C.ok, lbl: "agent" },
    sys: { c: s.bad ? C.danger : C.proj, lbl: "系统" },
  };
  const m = map[s.who];
  return (
    <div className="fade" style={{ display: "flex", gap: 10 }}>
      <span style={{ fontFamily: MONO, fontSize: 10, color: m.c, width: 40, flexShrink: 0, paddingTop: 2 }}>{m.lbl}</span>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 11, color: C.faint, marginBottom: 3 }}>{s.t}</div>
        <div style={{ fontSize: 13, color: s.bad ? C.danger : C.ink, lineHeight: 1.55 }}>{s.s}</div>
      </div>
    </div>
  );
}
function Stamp({ tone, text }) {
  const col = tone === "bad" ? C.danger : C.ok;
  return (
    <div style={{ marginTop: 4, fontFamily: MONO, fontSize: 11, color: col,
      background: tone === "bad" ? C.dangerSoft : C.okSoft, borderRadius: 8, padding: "8px 11px" }}>
      {tone === "bad" ? "✕ " : "✓ "}{text}
    </div>
  );
}

// ── 屏 3：攻关模式 ────────────────────────────────────────────
function DeepScreen({ r, proj, onBack }) {
  return (
    <div className="fade" style={{ paddingTop: 28 }}>
      <Crumb proj={proj} r={{ ...r, title: r.title || "统一错误码体系" }} onBack={onBack} />

      <div style={{ background: C.dangerSoft, border: `1px solid ${C.danger}55`, borderRadius: 14,
        padding: "15px 18px", display: "flex", gap: 12, alignItems: "center", marginBottom: 24 }}>
        <span style={{ color: C.danger, fontSize: 16 }}>⏏</span>
        <div style={{ fontSize: 13.5, lineHeight: 1.55, color: C.ink }}>
          <b>阀门触发：结果级循环已失效。</b>
          <span style={{ color: C.body }}> 系统替你跑了 3 轮「批注→归因→重跑」，每轮都栽在同一处、且无收敛迹象。现在——也只有现在——请你打开过程。</span>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.05fr 1fr", gap: 20, alignItems: "start" }}>
        <div>
          <Eyebrow t="过程轨迹 · 折叠成一屏，红色标出反复栽倒处" noTop />
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 10 }}>
            {TRACE.map((n) => {
              const m = { ok: [C.ok, "✓"], bad: [C.danger, "✕"], stuck: [C.clay, "⏸"] }[n.state];
              return (
                <div key={n.id} style={{ display: "flex", gap: 11, alignItems: "center", padding: "12px",
                  borderRadius: 10, marginBottom: 4, background: n.state === "bad" ? C.dangerSoft : "transparent" }}>
                  <span style={{ width: 20, height: 20, borderRadius: 6, flexShrink: 0, background: m[0] + "22",
                    color: m[0], fontSize: 11, fontFamily: MONO, display: "flex", alignItems: "center", justifyContent: "center" }}>{m[1]}</span>
                  <span style={{ fontFamily: MONO, fontSize: 11, color: C.faint, width: 22 }}>{n.id}</span>
                  <span style={{ flex: 1, fontSize: 14, color: n.state === "ok" ? C.dim : C.ink,
                    fontWeight: n.state === "ok" ? 400 : 600 }}>{n.title}</span>
                  {n.note && <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.danger }}>{n.note}</span>}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <Eyebrow t="为什么自动收敛失败 · 三轮留痕" noTop />
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 16,
            display: "flex", flexDirection: "column", gap: 13 }}>
            {[
              ["第 1 轮", "归因到命名风格，改了枚举名。审查者：根因未动。"],
              ["第 2 轮", "归因到映射表缺项，补了 3 条。审查者：仍漏旧码段。"],
              ["第 3 轮", "归因到兼容层，重写。审查者：与新枚举循环依赖。"],
            ].map(([k, v], i) => (
              <div key={i} style={{ display: "flex", gap: 10 }}>
                <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.danger, width: 38, flexShrink: 0, paddingTop: 2 }}>{k}</span>
                <span style={{ fontSize: 13, color: C.body, lineHeight: 1.55 }}>{v}</span>
              </div>
            ))}
            <div style={{ fontSize: 13, color: C.ink, lineHeight: 1.6, background: C.clayWash,
              borderRadius: 10, padding: "11px 13px" }}>
              系统判断：三轮归因在「症状」间打转，未触达「旧码与新枚举的根本结构冲突」。这是模型当前盲区 —— 该你下场重新定义问题了。
            </div>
            <button onClick={onBack} style={btnPrimary}>我来接管这个根因 →</button>
          </div>
        </div>
      </div>

      <p style={{ marginTop: 22, color: C.dim, fontSize: 13, lineHeight: 1.65, maxWidth: 720 }}>
        你打开过程，是因为系统已证明「结果级反馈这条便宜的路走不通」。这正是省下平庸注意力、
        把它攒到这一刻的意义 —— 攻关只发生在真正配得上你智力的地方。
      </p>
    </div>
  );
}

// ── 公共件 ────────────────────────────────────────────────────
function Crumb({ proj, r, onBack }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 11, flexWrap: "wrap", marginBottom: 8 }}>
      <button onClick={onBack} style={{ all: "unset", cursor: "pointer", color: C.dim, fontSize: 13, fontFamily: MONO }}>← 项目台</button>
      <span style={{ color: C.faint }}>/</span>
      <span style={{ fontFamily: MONO, fontSize: 12, color: C.proj }}>{proj.id}</span>
      <span style={{ color: C.faint }}>/</span>
      <span style={{ fontFamily: MONO, fontSize: 12, color: C.faint }}>{r.id}</span>
      <span style={{ fontFamily: SERIF, fontSize: 18, fontWeight: 500, color: C.ink }}>{r.title}</span>
    </div>
  );
}
function Eyebrow({ t, noTop }) {
  return (
    <div style={{ display: "flex", gap: 9, alignItems: "center", margin: noTop ? "0 0 12px" : "26px 0 12px" }}>
      <span style={{ width: 5, height: 5, borderRadius: "50%", background: C.clay }} />
      <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.dim, letterSpacing: ".4px" }}>{t}</span>
    </div>
  );
}
const btnPrimary = {
  all: "unset", cursor: "pointer", textAlign: "center", padding: "10px 18px", borderRadius: 10,
  background: C.clay, color: "#FFF", fontWeight: 600, fontSize: 13.5, display: "block", width: "100%", boxSizing: "border-box",
};
const btnGhost = {
  all: "unset", cursor: "pointer", padding: "9px 16px", borderRadius: 9,
  border: `1px solid ${C.line}`, color: C.body, fontSize: 13, whiteSpace: "nowrap", background: C.surface2,
};

const css = `
  * { box-sizing: border-box; }
  body { margin: 0; }
  .fade { animation: fade .3s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  .breathe { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  textarea::placeholder { color: ${C.faint}; }
  button:focus-visible { outline: 2px solid ${C.clay}; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: ${C.line}; border-radius: 5px; border: 3px solid ${C.bg}; }
  @media (max-width: 920px) {
    aside { display: none !important; }
    h1 { font-size: 26px !important; }
    [style*="grid-template-columns: 1fr 1fr"], [style*="grid-template-columns: 1.05fr 1fr"] { grid-template-columns: 1fr !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
`;


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
